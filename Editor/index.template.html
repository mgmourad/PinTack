<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  SPEC.md §4.4: the webview loads only local content. Nothing here can reach the
  network: default-src is 'none', connect-src is 'none', and scripts/images/fonts
  are limited to the app's own pintack-app: scheme. The one inline script (the
  import map) is allowed by hash rather than by 'unsafe-inline'.
  style-src needs 'unsafe-inline' because CodeMirror injects its stylesheet and
  decorations use style attributes for colored text.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src pintack-app: '%%IMPORTMAP_HASH%%'; style-src pintack-app: 'unsafe-inline'; img-src pintack-app: data:; font-src pintack-app:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PinTack editor</title>
<link rel="stylesheet" href="editor.css">
<script type="importmap">%%IMPORTMAP%%</script>
</head>
<body>
<div id="editor"></div>
<div id="emoji" class="hidden"></div>
<script type="module" src="editor.js"></script>
</body>
</html>
